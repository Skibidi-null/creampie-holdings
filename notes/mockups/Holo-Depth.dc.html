    <svg width="326" height="96" viewBox="0 0 326 96" role="img" aria-label="Depth chart: buyers on the left, sellers on the right">

  </div>

    <span style="padding: 6px 10px; border-radius: 10px; background: rgba(122,92,255,0.18); color: #CBBFFF">+ RSI</span><span style="padding: 6px 10px; border-radius: 10px; background: rgba(122,92,255,0.18); color: #CBBFFF">+ MACD</span><span style="padding: 6px 10px; border-radius: 10px; background: rgba(255,255,255,0.06); color: #A9ABC8">+ Bollinger</span><span style="padding: 6px 10px; border-radius: 10px; background: rgba(255,255,255,0.06); color: #A9ABC8">+ VWAP</span><span style="padding: 6px 10px; border-radius: 10px; background: rgba(255,255,255,0.06); color: #A9ABC8">+ Draw lines</span>
  </div>
  <div style="position: absolute; left: 16px; right: 16px; bottom: 22px; display: flex; gap: 8px">
    <button style="flex: 1; height: 48px; border-radius: 15px; border: none; background: linear-gradient(120deg, #3CFFB4, #00D2FF); color: #04140F; font-family: inherit; font-size: 15px; font-weight: 700">Buy</button>
    <button style="flex: 1; height: 48px; border-radius: 15px; border: none; background: linear-gradient(120deg, #FF3CC8, #FF5C8A); color: #1A0410; font-family: inherit; font-size: 15px; font-weight: 700">Sell</button>
  </div>
