<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>App icon options</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E0F14; color: #E8E9F0; font-family: 'Space Grotesk', sans-serif; padding: 40px 30px; display: flex; flex-direction: column; gap: 34px">
  <span style="font-size: 20px; font-weight: 600">App icon options</span>
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 30px 26px">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 12px">
      <svg width="132" height="132" viewBox="0 0 132 132" role="img" aria-label="Icon 1, holographic C with candle">
        <defs><linearGradient id="i1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF3CC8"/><stop offset="0.35" stop-color="#7A5CFF"/><stop offset="0.7" stop-color="#00D2FF"/><stop offset="1" stop-color="#3CFFB4"/></linearGradient><radialGradient id="i1b" cx="0.3" cy="0.2" r="1"><stop offset="0" stop-color="#1D1A33"/><stop offset="1" stop-color="#05050A"/></radialGradient></defs>
        <rect width="132" height="132" rx="30" fill="url(#i1b)"/>
        <path d="M92 40 A34 34 0 1 0 92 92" fill="none" stroke="url(#i1)" stroke-width="11" stroke-linecap="round"/>
        <line x1="78" y1="48" x2="78" y2="84" stroke="#3CFFB4" stroke-width="2"/><rect x="73" y="55" width="10" height="20" rx="2" fill="#3CFFB4"/>
      </svg>
      <span style="font-size: 13px; color: #A9ABC8">1. Holo C + candle</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 12px">
      <svg width="132" height="132" viewBox="0 0 132 132" role="img" aria-label="Icon 2, cobalt rising bars">
        <defs><linearGradient id="i2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#2F6BFF"/><stop offset="1" stop-color="#43F5A7"/></linearGradient><radialGradient id="i2b" cx="0.5" cy="0.2" r="1"><stop offset="0" stop-color="#0D2350"/><stop offset="1" stop-color="#030814"/></radialGradient></defs>
        <rect width="132" height="132" rx="30" fill="url(#i2b)"/>
        <rect x="30" y="74" width="14" height="28" rx="4" fill="url(#i2)" opacity="0.6"/><rect x="51" y="60" width="14" height="42" rx="4" fill="url(#i2)" opacity="0.75"/><rect x="72" y="46" width="14" height="56" rx="4" fill="url(#i2)" opacity="0.9"/><rect x="93" y="30" width="14" height="72" rx="4" fill="url(#i2)"/>
        <path d="M28 66 L58 50 L78 56 L106 26" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
      </svg>
      <span style="font-size: 13px; color: #A9ABC8">2. Cobalt growth</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 12px">
      <svg width="132" height="132" viewBox="0 0 132 132" role="img" aria-label="Icon 3, gold coin with arrow">
        <defs><linearGradient id="i3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFE9A0"/><stop offset="0.5" stop-color="#E2B44C"/><stop offset="1" stop-color="#9C7424"/></linearGradient></defs>
        <rect width="132" height="132" rx="30" fill="#0A0A0E"/>
        <circle cx="62" cy="70" r="36" fill="none" stroke="url(#i3)" stroke-width="7"/>
        <circle cx="62" cy="70" r="26" fill="none" stroke="url(#i3)" stroke-width="1.5" stroke-dasharray="3 4"/>
        <path d="M44 82 L58 66 L68 74 L98 40" fill="none" stroke="#3CFFB4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M86 38 H100 V52" fill="none" stroke="#3CFFB4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span style="font-size: 13px; color: #A9ABC8">3. Gold coin + rise</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 12px">
      <svg width="132" height="132" viewBox="0 0 132 132" role="img" aria-label="Icon 4, hexagon CH monogram">
        <defs><linearGradient id="i4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7CF7FF"/><stop offset="1" stop-color="#8C50FF"/></linearGradient></defs>
        <rect width="132" height="132" rx="30" fill="#07060F"/>
        <path d="M66 18 L106 41 L106 91 L66 114 L26 91 L26 41 Z" fill="rgba(140,80,255,0.12)" stroke="url(#i4)" stroke-width="4"/>
        <text x="66" y="78" text-anchor="middle" fill="#FFFFFF" font-family="Space Grotesk" font-size="30" font-weight="700" letter-spacing="-1">CH</text>
      </svg>
      <span style="font-size: 13px; color: #A9ABC8">4. Hex monogram</span>
    </div>
  </div>
  <span style="font-size: 12px; color: #6E7190; line-height: 1.5">Each icon would come with a matching colour of the chosen design. Small sizes are checked so they stay clear on the home screen.</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body>
</html>
