<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Holo multi-price alerts</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#9DF6FF}a:hover{color:#FFFFFF}
@keyframes ping{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.2);opacity:0}}
.ping{animation:ping 1.8s ease-out infinite;transform-origin:center}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #040407; color: #F4F5FA; font-family: 'Space Grotesk', sans-serif; position: relative; overflow: hidden">
  <div aria-hidden="true" style="position: absolute; right: -150px; top: -100px; width: 420px; height: 420px; border-radius: 50%; background: radial-gradient(circle, rgba(255,227,110,0.18), rgba(255,227,110,0) 62%)"></div>
  <div style="position: absolute; left: 16px; right: 16px; top: 48px; display: flex; align-items: center; gap: 12px">
    <button aria-label="Back" style="width: 40px; height: 40px; border-radius: 13px; border: 1px solid rgba(255,255,255,0.10); background: rgba(255,255,255,0.05); color: #E6E7F2; display: flex; align-items: center; justify-content: center"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div style="flex-grow: 1; display: flex; flex-direction: column"><span style="font-size: 17px; font-weight: 600">Gold alerts</span><span style="font-size: 11px; color: #8A8DA6">5 active · drag a line on the chart to move it</span></div>
  </div>

  <div style="position: absolute; left: 16px; right: 16px; top: 108px; height: 330px; border-radius: 22px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); overflow: hidden">
    <svg width="358" height="330" viewBox="0 0 358 330" role="img" aria-label="Price chart with five alert lines at different prices">
      <defs><linearGradient id="pf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE36E" stop-opacity="0.25"/><stop offset="1" stop-color="#FFE36E" stop-opacity="0"/></linearGradient></defs>
      <rect x="0" y="118" width="358" height="64" fill="rgba(0,210,255,0.08)"/>
      <path d="M0 230 C30 222 50 236 80 214 C110 192 130 206 160 184 C190 162 210 176 240 160 C270 144 290 156 320 150 L358 146 L358 330 L0 330 Z" fill="url(#pf)"/>
      <path d="M0 230 C30 222 50 236 80 214 C110 192 130 206 160 184 C190 162 210 176 240 160 C270 144 290 156 320 150 L358 146" fill="none" stroke="#FFE36E" stroke-width="2"/>
      <circle cx="358" cy="146" r="4" fill="#FFE36E"/>
      <line x1="0" y1="56" x2="358" y2="56" stroke="#3CFFB4" stroke-width="1.4" stroke-dasharray="6 4"/>
      <line x1="0" y1="118" x2="358" y2="118" stroke="#00D2FF" stroke-width="1.2"/>
      <line x1="0" y1="182" x2="358" y2="182" stroke="#00D2FF" stroke-width="1.2"/>
      <line x1="0" y1="250" x2="358" y2="250" stroke="#FF5C8A" stroke-width="1.4" stroke-dasharray="6 4"/>
      <line x1="0" y1="292" x2="358" y2="292" stroke="#FF3CC8" stroke-width="1.4" stroke-dasharray="2 4"/>
      <g font-family="JetBrains Mono" font-size="9">
        <rect x="262" y="46" width="90" height="20" rx="6" fill="rgba(60,255,180,0.18)"/><text x="270" y="60" fill="#3CFFB4">TARGET · above</text>
        <rect x="236" y="108" width="116" height="20" rx="6" fill="rgba(0,210,255,0.18)"/><text x="244" y="122" fill="#9DF6FF">RANGE · leaves zone</text>
        <rect x="262" y="240" width="90" height="20" rx="6" fill="rgba(255,92,138,0.18)"/><text x="270" y="254" fill="#FF8AA8">STOP · below</text>
        <rect x="236" y="282" width="116" height="20" rx="6" fill="rgba(255,60,200,0.18)"/><text x="244" y="296" fill="#FF8ADB">BUY DIP · -5% week</text>
      </g>
      <circle cx="16" cy="56" r="5" fill="#3CFFB4"/><circle cx="16" cy="56" r="5" fill="#3CFFB4" class="ping"/>
    </svg>
  </div>

  <div style="position: absolute; left: 16px; right: 16px; top: 452px; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 16px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08)"><span style="width: 10px; height: 10px; border-radius: 5px; background: #3CFFB4"></span><div style="flex-grow: 1; display: flex; flex-direction: column"><span style="font-size: 13px; font-weight: 500">Price goes above [level 1]</span><span style="font-size: 11px; color: #8A8DA6">Take profit · sound + vibration</span></div><span style="width: 40px; height: 24px; border-radius: 12px; background: #3CFFB4; position: relative"><span style="position: absolute; right: 3px; top: 3px; width: 18px; height: 18px; border-radius: 9px; background: #04140F"></span></span></div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 16px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08)"><span style="width: 10px; height: 10px; border-radius: 5px; background: #00D2FF"></span><div style="flex-grow: 1; display: flex; flex-direction: column"><span style="font-size: 13px; font-weight: 500">Leaves the range [from] to [to]</span><span style="font-size: 11px; color: #8A8DA6">Breakout either way · once</span></div><span style="width: 40px; height: 24px; border-radius: 12px; background: #00D2FF; position: relative"><span style="position: absolute; right: 3px; top: 3px; width: 18px; height: 18px; border-radius: 9px; background: #031018"></span></span></div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 16px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08)"><span style="width: 10px; height: 10px; border-radius: 5px; background: #FF5C8A"></span><div style="flex-grow: 1; display: flex; flex-direction: column"><span style="font-size: 13px; font-weight: 500">Price falls below [level 2]</span><span style="font-size: 11px; color: #8A8DA6">Protect · every time</span></div><span style="width: 40px; height: 24px; border-radius: 12px; background: #FF5C8A; position: relative"><span style="position: absolute; right: 3px; top: 3px; width: 18px; height: 18px; border-radius: 9px; background: #1A0410"></span></span></div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 16px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08)"><span style="width: 10px; height: 10px; border-radius: 5px; background: #FF3CC8"></span><div style="flex-grow: 1; display: flex; flex-direction: column"><span style="font-size: 13px; font-weight: 500">Drops 5% in a week</span><span style="font-size: 11px; color: #8A8DA6">Buy-the-dip reminder</span></div><span style="width: 40px; height: 24px; border-radius: 12px; background: rgba(255,255,255,0.12); position: relative"><span style="position: absolute; left: 3px; top: 3px; width: 18px; height: 18px; border-radius: 9px; background: #6E7190"></span></span></div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 16px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08)"><span style="width: 10px; height: 10px; border-radius: 5px; background: #FFE36E"></span><div style="flex-grow: 1; display: flex; flex-direction: column"><span style="font-size: 13px; font-weight: 500">Advisor score turns SELL</span><span style="font-size: 11px; color: #8A8DA6">Signal alert</span></div><span style="width: 40px; height: 24px; border-radius: 12px; background: #FFE36E; position: relative"><span style="position: absolute; right: 3px; top: 3px; width: 18px; height: 18px; border-radius: 9px; background: #1A1404"></span></span></div>
  </div>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 22px; display: flex; gap: 8px">
    <button style="flex: 1; height: 50px; border-radius: 16px; border: none; background: linear-gradient(120deg, #FF3CC8, #7A5CFF, #00D2FF); color: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 700">+ Add alert</button>
    <button style="width: 120px; height: 50px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.05); color: #F4F5FA; font-family: inherit; font-size: 13px">Price ladder</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body>
</html>
