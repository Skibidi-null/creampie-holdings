<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#3a0b3f"/>
      <stop offset=".55" stop-color="#16051c"/>
      <stop offset="1" stop-color="#07020a"/>
    </radialGradient>
    <linearGradient id="crust" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffcf6b"/>
      <stop offset="1" stop-color="#c97a1c"/>
    </linearGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffe9f3"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="0" fill="url(#bg)"/>
  <!-- neon ring -->
  <circle cx="256" cy="268" r="196" fill="none" stroke="#ff2e88" stroke-width="10" filter="url(#glow)" opacity=".95"/>
  <circle cx="256" cy="268" r="196" fill="none" stroke="#ffd1e6" stroke-width="3"/>
  <!-- XXX neon sign -->
  <g filter="url(#glow)">
    <text x="256" y="150" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="92" letter-spacing="10" fill="none" stroke="#ff2e88" stroke-width="7">XXX</text>
  </g>
  <text x="256" y="150" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="92" letter-spacing="10" fill="none" stroke="#ffe3f0" stroke-width="2.5">XXX</text>
  <!-- pie dish -->
  <ellipse cx="256" cy="372" rx="150" ry="26" fill="#000" opacity=".45" filter="url(#soft)"/>
  <path d="M106 300 L126 362 Q256 392 386 362 L406 300 Z" fill="url(#crust)"/>
  <path d="M126 362 Q256 392 386 362" fill="none" stroke="#8a4a0c" stroke-width="5"/>
  <g stroke="#a65d14" stroke-width="5" stroke-linecap="round" opacity=".7">
    <path d="M150 318 l8 36"/><path d="M196 322 l4 40"/><path d="M256 324 v42"/><path d="M316 322 l-4 40"/><path d="M362 318 l-8 36"/>
  </g>
  <!-- crust rim -->
  <ellipse cx="256" cy="300" rx="152" ry="34" fill="#e8a43e"/>
  <!-- cream top, overflowing and dripping -->
  <path fill="url(#cream)" d="M112 296
     C 120 262, 180 246, 256 246
     C 332 246, 392 262, 400 296
     C 402 306, 396 312, 388 312
     C 384 330, 384 352, 374 356 C 364 360, 360 344, 360 326 C 358 318, 352 316, 346 318
     C 344 336, 344 380, 330 384 C 316 388, 314 360, 314 334 C 312 324, 300 324, 292 326
     C 286 330, 282 336, 280 324 C 270 324, 254 326, 244 326
     C 240 350, 242 404, 226 408 C 210 412, 210 372, 212 330 C 204 326, 190 324, 182 322
     C 178 334, 176 346, 166 348 C 154 350, 156 330, 156 318
     C 146 316, 134 316, 126 314 C 116 312, 110 306, 112 296 Z"/>
  <!-- cream shine + drop -->
  <path d="M170 270 C 200 258, 240 254, 280 256" stroke="#fff" stroke-width="7" stroke-linecap="round" fill="none" opacity=".9"/>
  <path d="M226 420 C 220 432, 222 444, 230 446 C 238 446, 240 434, 226 420 Z" fill="#fff"/>
  <!-- cherry on top -->
  <circle cx="300" cy="236" r="20" fill="#ff2e5a"/>
  <circle cx="294" cy="230" r="6" fill="#ffb3c4"/>
  <path d="M300 218 C 304 196, 318 186, 334 182" stroke="#5ad17a" stroke-width="5" fill="none" stroke-linecap="round"/>
</svg>
